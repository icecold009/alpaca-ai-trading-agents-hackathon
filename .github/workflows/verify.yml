name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Credential-free local verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RISKCOURT_MODE: recorded
      RISKCOURT_LIVE_TRADING: "false"
      ALPACA_LIVE_TRADING: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      # This gate is intentionally local-only: it does not use production
      # secrets, contact Alpaca, deploy, place paper orders, or mutate a DB.
      - name: Run credential-free local verification
        run: python scripts/verify.py
